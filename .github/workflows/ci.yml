name: tests-and-evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: offline        # CI never calls Azure: free, and no secrets needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and integration tests (synthetic data, offline)
        run: pytest -q

      - name: Cache the raw bank data (~70 MB)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-v1

      - name: Download data and build the database (with quality checks)
        run: |
          python -m bank_assistant.data.download
          python -m bank_assistant.data.build_db

      - name: Train and evaluate the default model
        run: python -m bank_assistant.model.train --repeats 5

      - name: Build the data dictionary index
        run: python -m bank_assistant.rag.index

      - name: Offline evaluation suite (fails the build if a metric drops below its threshold)
        run: python -m bank_assistant.evals.run

      - name: Post the report on the run page
        if: always()
        run: |
          cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY" || true
          cat data/processed/model/model_card.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            evals/reports/
            data/processed/model/model_card.md
